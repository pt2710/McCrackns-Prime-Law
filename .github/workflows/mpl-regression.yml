name: MPL Regression Validation

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run MPL regression suite (10k primes)
        run: |
          pytest tests/test_regression_against_reference.py -s
